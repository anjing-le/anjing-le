<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anjing products</title><desc id="desc">三个长期产品：个人 AI 桌面助手、AIGC 内容工作台和投资监控工具。</desc>

  <style>
    .hand{font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",ui-sans-serif,sans-serif}
    .line{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .soft-line{fill:none;stroke:#111827;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .flow{stroke-dasharray:7 9;animation:flow 1.8s linear infinite}
    .bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .blink{animation:blink 1.1s steps(2,end) infinite}
    .orbit{animation:orbit 7s linear infinite;transform-box:fill-box;transform-origin:center}
    .draw{stroke-dasharray:64;stroke-dashoffset:64;animation:draw 2.6s ease-in-out infinite}
    .bar1,.bar2,.bar3{transform-box:fill-box;transform-origin:center bottom;animation:grow 2.4s ease-in-out infinite}
    .bar2{animation-delay:.22s}.bar3{animation-delay:.44s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.72}}
    @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.15}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes draw{0%,18%{stroke-dashoffset:64}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}
    @keyframes grow{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    @media(prefers-reduced-motion:reduce){.flow,.bob,.pulse,.blink,.orbit,.draw,.bar1,.bar2,.bar3{animation:none!important}}
  </style>

  <rect width="1200" height="400" rx="30" fill="#fffdf7"/>
  <path d="M34 31C196 19 325 38 482 28C650 18 832 27 1161 34C1172 111 1155 276 1164 359C938 375 740 357 571 369C379 382 189 356 38 365C23 247 39 132 34 31Z" fill="#fffaf0" stroke="#111827" stroke-opacity=".72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="hand" x="67" y="73" fill="#111827" font-size="39" font-weight="900">Products grown from real life</text>
  <text class="hand" x="69" y="106" fill="#5b6472" font-size="21" font-weight="800">不是概念 Demo：每一个都从自己的日常系统里长出来</text>
  <g transform="translate(66 135)"><path d="M0 4C72-7 133 5 197 0C245-3 300 2 328 8C335 59 328 174 333 224C254 232 184 221 119 227C69 232 29 224 5 227C-6 158 3 73 0 4Z" fill="#eef6ff" stroke="#5b8def" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="hand" x="27" y="44" fill="#111827" font-size="27" font-weight="900">anjing-anjing</text><text class="hand" x="29" y="75" fill="#374151" font-size="18" font-weight="800">个人 AI 桌面助手</text><text class="hand" x="29" y="101" fill="#6b7280" font-size="15" font-weight="800">12 条成长赛道的统一入口</text><g transform="translate(95 119) scale(.72)">
    <rect x="16" y="7" width="130" height="105" rx="15" fill="#fffdf7" class="line"/>
    <path d="M17 35H145" class="soft-line"/><circle cx="33" cy="21" r="4.5" fill="#5b8def"/><circle cx="49" cy="21" r="4.5" fill="#f3c969"/>
    <rect x="34" y="51" width="42" height="42" rx="10" fill="#eef6ff" stroke="#5b8def" stroke-width="4"/>
    <circle cx="55" cy="72" r="8" fill="#5b8def" class="pulse"/>
    <path d="M76 72H95M116 51V42M116 93v11" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 7" class="flow"/>
    <rect x="96" y="47" width="39" height="21" rx="7" fill="#e9f8ef" stroke="#111827" stroke-width="4"/>
    <rect x="96" y="77" width="39" height="21" rx="7" fill="#fff4db" stroke="#111827" stroke-width="4"/>
    <path d="M3 125c34-8 116-7 159 0" stroke="#5b8def" stroke-width="5" stroke-linecap="round"/>
    </g></g>
  <g transform="translate(433 135)"><path d="M0 8C66-4 132 3 197 0C251-3 297 1 332 9C337 62 329 171 335 224C258 234 182 221 118 228C67 233 29 223 5 227C-5 160 4 77 0 8Z" fill="#fff4ee" stroke="#e98263" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="hand" x="27" y="44" fill="#111827" font-size="27" font-weight="900">anjing-aigc</text><text class="hand" x="29" y="75" fill="#374151" font-size="18" font-weight="800">AIGC 图文创作工作台</text><text class="hand" x="29" y="101" fill="#6b7280" font-size="15" font-weight="800">灵感 → 内容 → 多平台资产</text><g transform="translate(103 116) scale(.72)">
    <path d="M6 66h35" stroke="#e98263" stroke-width="5" stroke-linecap="round" class="flow"/><path d="M13 51l6 10 11 3-10 6-3 11-6-10-11-3 10-6Z" fill="#f3c969" class="pulse"/>
    <path d="M43 22h70v86H43Z" fill="#fffdf7" class="line"/>
    <path d="M54 80l16-20 13 14 11-12 10 22H54Z" fill="#fff4ee" stroke="#e98263" stroke-width="3" stroke-linejoin="round"/><circle cx="92" cy="45" r="8" fill="#f3c969"/>
    <g class="bob"><rect x="99" y="49" width="58" height="70" rx="9" fill="#f4f1ff" class="line"/><path d="M112 68h31M112 82h25M112 96h34" stroke="#e98263" stroke-width="4" stroke-linecap="round"/></g>
    <path d="M117 16l5 10 11 5-11 5-5 11-5-11-11-5 11-5Z" fill="#e98263" class="pulse"/>
    </g></g>
  <g transform="translate(800 135)"><path d="M0 4C75-7 135 5 202 0C254-3 302 2 334 8C338 60 329 174 335 224C256 233 182 222 118 228C67 233 29 223 5 227C-6 159 3 73 0 4Z" fill="#f3faef" stroke="#79b36a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="hand" x="27" y="44" fill="#111827" font-size="27" font-weight="900">anjing-richfree</text><text class="hand" x="29" y="75" fill="#374151" font-size="18" font-weight="800">AI 投资监控工具</text><text class="hand" x="29" y="101" fill="#6b7280" font-size="15" font-weight="800">信息 → 信号 → 决策观察</text><g transform="translate(61 126)"><rect x="0" y="0" width="205" height="76" rx="12" fill="#fffdf7" class="line"/><path d="M20 58c25-9 34-28 53-22 21 7 30-17 49-10 18 7 31-11 61-18" stroke="#79b36a" stroke-width="6" fill="none" stroke-linecap="round" class="draw"/><path d="M170 8h15v15" stroke="#79b36a" stroke-width="5" fill="none"/><circle cx="74" cy="36" r="7" fill="#f3c969" class="pulse"/><circle cx="122" cy="26" r="7" fill="#e98263" class="pulse" style="animation-delay:.4s"/></g></g>
</svg>
