<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anjing open-source route</title><desc id="desc">从工程底座、Agent 实战、创作者工具到产品落地的开源路线。</desc>

  <style>
    .hand{font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",ui-sans-serif,sans-serif}
    .line{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .soft-line{fill:none;stroke:#111827;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .flow{stroke-dasharray:7 9;animation:flow 1.8s linear infinite}
    .bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .blink{animation:blink 1.1s steps(2,end) infinite}
    .orbit{animation:orbit 7s linear infinite;transform-box:fill-box;transform-origin:center}
    .draw{stroke-dasharray:64;stroke-dashoffset:64;animation:draw 2.6s ease-in-out infinite}
    .bar1,.bar2,.bar3{transform-box:fill-box;transform-origin:center bottom;animation:grow 2.4s ease-in-out infinite}
    .bar2{animation-delay:.22s}.bar3{animation-delay:.44s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.72}}
    @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.15}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes draw{0%,18%{stroke-dashoffset:64}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}
    @keyframes grow{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    @media(prefers-reduced-motion:reduce){.flow,.bob,.pulse,.blink,.orbit,.draw,.bar1,.bar2,.bar3{animation:none!important}}
  </style>

  <rect width="1200" height="340" rx="28" fill="#fffdf7"/>
  <path d="M35 33C192 20 308 38 469 28C631 18 796 26 1160 34C1172 104 1157 235 1165 306C946 320 743 305 576 315C383 327 190 307 39 314C23 220 39 126 35 33Z" fill="#fffaf0" stroke="#111827" stroke-opacity=".78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="hand" x="71" y="78" fill="#111827" font-size="40" font-weight="900">Build → Agent → Create → Ship</text>
  <text class="hand" x="73" y="111" fill="#5b6472" font-size="21" font-weight="800">把基础设施、AI 实战和真实产品放在同一条公开路线里</text>
  <path d="M139 228C327 176 469 235 642 194C802 156 940 196 1080 161" stroke="#9ca3af" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 14" class="flow"/>
  <g transform="translate(75 165)"><g class="bob"><path d="M8 12C28-1 86 2 110 10C113 43 109 88 112 116C72 121 34 114 6 118C0 84 7 47 8 12Z" fill="#eef6ff" stroke="#5b8def" stroke-width="5"/><rect x="26" y="34" width="64" height="48" rx="8" fill="#fffdf7" class="soft-line"/><path d="M27 49h62M39 62l8 7-8 7M55 76h18" stroke="#5b8def" stroke-width="4" fill="none" stroke-linecap="round"/><text class="hand" x="23" y="109" fill="#111827" font-size="16" font-weight="900">INFRA</text></g></g>
  <g transform="translate(343 146)"><g class="bob" style="animation-delay:.25s"><path d="M5 10C33 2 96 5 124 12C128 47 122 94 126 123C85 128 39 120 6 124C0 87 5 48 5 10Z" fill="#fff2f3" stroke="#e36d7b" stroke-width="5"/><circle cx="65" cy="55" r="25" fill="#fffdf7" class="soft-line"/><path d="M65 33v44M43 55h44" stroke="#e36d7b" stroke-width="5" stroke-linecap="round"/><circle cx="65" cy="55" r="8" fill="#f3c969" class="pulse"/><text class="hand" x="25" y="113" fill="#111827" font-size="16" font-weight="900">AGENT</text></g></g>
  <g transform="translate(641 125)"><g class="bob" style="animation-delay:.5s"><path d="M7 13C36 3 107 6 137 10C142 50 134 102 139 134C93 141 43 131 7 136C0 96 6 53 7 13Z" fill="#f3faef" stroke="#79b36a" stroke-width="5"/><path d="M29 38h84v56H29Z" fill="#fffdf7" class="soft-line"/><path d="M43 77l16-19 13 12 13-17 16 26H43Z" fill="#d9efcf" stroke="#79b36a" stroke-width="3"/><circle cx="96" cy="50" r="7" fill="#f3c969"/><text class="hand" x="30" y="124" fill="#111827" font-size="16" font-weight="900">CREATOR</text></g></g>
  <g transform="translate(958 95)"><g class="bob" style="animation-delay:.75s"><path d="M4 11C32 1 101 4 130 10C135 52 128 108 133 143C88 149 42 139 5 144C0 103 4 55 4 11Z" fill="#f4f1ff" stroke="#8975ff" stroke-width="5"/><path d="M28 39h78v61H28Z" fill="#fffdf7" class="soft-line"/><path d="M40 85c13-15 23-9 32-22 8-12 18-4 27-18" stroke="#8975ff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M90 44h11v12" stroke="#8975ff" stroke-width="4" fill="none"/><text class="hand" x="29" y="130" fill="#111827" font-size="16" font-weight="900">PRODUCT</text></g></g>
  <circle r="8" fill="#e98263"><animateMotion dur="7s" repeatCount="indefinite" path="M139 228C327 176 469 235 642 194C802 156 940 196 1080 161"/></circle>
</svg>
