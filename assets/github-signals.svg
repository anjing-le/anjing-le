<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub signals</title><desc id="desc">持续构建、发布与分享的公开信号。</desc>

  <style>
    .hand{font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",ui-sans-serif,sans-serif}
    .line{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .soft-line{fill:none;stroke:#111827;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .flow{stroke-dasharray:7 9;animation:flow 1.8s linear infinite}
    .bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .blink{animation:blink 1.1s steps(2,end) infinite}
    .orbit{animation:orbit 7s linear infinite;transform-box:fill-box;transform-origin:center}
    .draw{stroke-dasharray:64;stroke-dashoffset:64;animation:draw 2.6s ease-in-out infinite}
    .bar1,.bar2,.bar3{transform-box:fill-box;transform-origin:center bottom;animation:grow 2.4s ease-in-out infinite}
    .bar2{animation-delay:.22s}.bar3{animation-delay:.44s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.72}}
    @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.15}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes draw{0%,18%{stroke-dashoffset:64}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}
    @keyframes grow{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    @media(prefers-reduced-motion:reduce){.flow,.bob,.pulse,.blink,.orbit,.draw,.bar1,.bar2,.bar3{animation:none!important}}
  </style>

  <rect width="1200" height="250" rx="28" fill="#fffdf7"/>
  <path d="M34 28C191 17 323 35 474 25C635 15 823 25 1163 31C1171 87 1158 173 1164 220C941 235 741 219 574 229C382 239 188 218 37 225C25 157 37 91 34 28Z" fill="#fffaf0" stroke="#111827" stroke-opacity=".72" stroke-width="5"/>
  <text class="hand" x="68" y="77" fill="#111827" font-size="37" font-weight="900">Open work leaves signals</text><text class="hand" x="70" y="109" fill="#5b6472" font-size="20" font-weight="800">持续构建，比一次性的“完成”更重要</text>
  <path d="M487 122h565" stroke="#9ca3af" stroke-width="4" stroke-dasharray="8 11" class="flow"/>
  <g transform="translate(468 91)"><rect width="164" height="89" rx="18" fill="#eef6ff" stroke="#5b8def" stroke-width="5"/><text class="hand" x="30" y="39" fill="#111827" font-size="22" font-weight="900">BUILD</text><path d="M31 61h101" stroke="#5b8def" stroke-width="5" stroke-linecap="round"/><circle cx="53" cy="61" r="8" fill="#5b8def" class="pulse"/></g>
  <g transform="translate(684 91)"><rect width="164" height="89" rx="18" fill="#fff4ee" stroke="#e98263" stroke-width="5"/><text class="hand" x="39" y="39" fill="#111827" font-size="22" font-weight="900">SHIP</text><path d="M33 64l45-28 53 28" stroke="#e98263" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="78" cy="37" r="8" fill="#f3c969" class="bob"/></g>
  <g transform="translate(900 91)"><rect width="164" height="89" rx="18" fill="#f3faef" stroke="#79b36a" stroke-width="5"/><text class="hand" x="32" y="39" fill="#111827" font-size="22" font-weight="900">SHARE</text><path d="M43 68l37-29 40 29" stroke="#79b36a" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="43" cy="68" r="7" fill="#79b36a" class="pulse"/><circle cx="80" cy="39" r="7" fill="#f3c969" class="pulse" style="animation-delay:.3s"/><circle cx="120" cy="68" r="7" fill="#e98263" class="pulse" style="animation-delay:.6s"/></g>
</svg>
