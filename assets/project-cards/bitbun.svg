<svg width="560" height="220" viewBox="0 0 560 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BitBun</title>
  <desc id="desc">文件 · 文字 · 图片；局域网直达 · 无云端。右侧动画演示项目的核心工作流。</desc>

  <style>
    .hand{font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",ui-sans-serif,sans-serif}
    .line{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .soft-line{fill:none;stroke:#111827;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .flow{stroke-dasharray:7 9;animation:flow 1.8s linear infinite}
    .bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .blink{animation:blink 1.1s steps(2,end) infinite}
    .orbit{animation:orbit 7s linear infinite;transform-box:fill-box;transform-origin:center}
    .draw{stroke-dasharray:64;stroke-dashoffset:64;animation:draw 2.6s ease-in-out infinite}
    .bar1,.bar2,.bar3{transform-box:fill-box;transform-origin:center bottom;animation:grow 2.4s ease-in-out infinite}
    .bar2{animation-delay:.22s}.bar3{animation-delay:.44s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.72}}
    @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.15}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes draw{0%,18%{stroke-dashoffset:64}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}
    @keyframes grow{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    @media(prefers-reduced-motion:reduce){.flow,.bob,.pulse,.blink,.orbit,.draw,.bar1,.bar2,.bar3{animation:none!important}}
  </style>

  <rect width="560" height="220" rx="24" fill="#fffdf7"/>
  <path d="M29 25C99 18 171 27 244 21C332 14 425 20 532 27C539 79 531 138 536 196C442 203 351 197 274 202C184 207 96 197 29 201C20 142 27 84 29 25Z" fill="#f4f1ff" stroke="#8975ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="51" y="39" width="142" height="25" rx="12.5" fill="#8975ff" fill-opacity=".13"/>
  <text class="hand" x="63" y="57" fill="#8975ff" font-size="12" font-weight="900" letter-spacing="1">CREATOR · SEND</text>
  <text class="hand" x="56" y="98" fill="#111827" font-size="33" font-weight="900">BitBun</text>
  <text class="hand" x="56" y="135" fill="#374151" font-size="19" font-weight="800">文件 · 文字 · 图片</text>
  <text class="hand" x="56" y="166" fill="#6b7280" font-size="15.5" font-weight="750">局域网直达 · 无云端</text>
  <path d="M56 181c64-5 150 5 231-1" stroke="#8975ff" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(375 42)">

    <rect x="3" y="18" width="75" height="53" rx="9" fill="#fffdf7" class="line"/><path d="M-6 80h91" class="line"/><circle cx="92" cy="76" r="10" fill="#34d399" class="pulse"/>
    <rect x="114" y="62" width="48" height="52" rx="9" fill="#f4f1ff" class="line"/><path d="M104 121h66" class="line"/>
    <path d="M78 51c18-18 36-18 53 0" stroke="#8975ff" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="7 8" class="flow"/><path d="M122 43l11 10-13 8" stroke="#8975ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="103" cy="39" r="6" fill="#8975ff" class="bob"/>

  </g>
</svg>
