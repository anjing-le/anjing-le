<svg width="560" height="220" viewBox="0 0 560 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">infra-llm-gateway</title>
  <desc id="desc">LLM 算力入口；多模型调度 · Key 池 · 用量统计。右侧动画演示项目的核心工作流。</desc>

  <style>
    .hand{font-family:"Comic Sans MS","Chalkboard SE","PingFang SC","Microsoft YaHei",ui-sans-serif,sans-serif}
    .line{fill:none;stroke:#111827;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .soft-line{fill:none;stroke:#111827;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .flow{stroke-dasharray:7 9;animation:flow 1.8s linear infinite}
    .bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .blink{animation:blink 1.1s steps(2,end) infinite}
    .orbit{animation:orbit 7s linear infinite;transform-box:fill-box;transform-origin:center}
    .draw{stroke-dasharray:64;stroke-dashoffset:64;animation:draw 2.6s ease-in-out infinite}
    .bar1,.bar2,.bar3{transform-box:fill-box;transform-origin:center bottom;animation:grow 2.4s ease-in-out infinite}
    .bar2{animation-delay:.22s}.bar3{animation-delay:.44s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.14);opacity:.72}}
    @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:.15}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes draw{0%,18%{stroke-dashoffset:64}55%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-64}}
    @keyframes grow{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    @media(prefers-reduced-motion:reduce){.flow,.bob,.pulse,.blink,.orbit,.draw,.bar1,.bar2,.bar3{animation:none!important}}
  </style>

  <rect width="560" height="220" rx="24" fill="#fffdf7"/>
  <path d="M29 25C99 18 171 27 244 21C332 14 425 20 532 27C539 79 531 138 536 196C442 203 351 197 274 202C184 207 96 197 29 201C20 142 27 84 29 25Z" fill="#ecf8ff" stroke="#398fca" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="51" y="39" width="142" height="25" rx="12.5" fill="#398fca" fill-opacity=".13"/>
  <text class="hand" x="63" y="57" fill="#398fca" font-size="12" font-weight="900" letter-spacing="1">INFRA · MODEL</text>
  <text class="hand" x="56" y="98" fill="#111827" font-size="33" font-weight="900">infra-llm-gateway</text>
  <text class="hand" x="56" y="135" fill="#374151" font-size="19" font-weight="800">LLM 算力入口</text>
  <text class="hand" x="56" y="166" fill="#6b7280" font-size="15.5" font-weight="750">多模型调度 · Key 池 · 用量统计</text>
  <path d="M56 181c64-5 150 5 231-1" stroke="#398fca" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(375 42)">

    <path d="M4 45h39l12 11-12 11H4c-8 0-8-22 0-22Z" fill="#fffdf7" class="soft-line"/><path d="M16 56h22" stroke="#398fca" stroke-width="4" stroke-linecap="round"/>
    <path d="M55 56H76" stroke="#398fca" stroke-width="4" class="flow"/>
    <circle cx="91" cy="56" r="20" fill="#ecf8ff" class="line"/><path d="M83 56h16M91 48v16" stroke="#398fca" stroke-width="4" stroke-linecap="round" class="pulse"/>
    <path d="M111 56h17M128 56V19M128 56v37" stroke="#398fca" stroke-width="4" stroke-dasharray="5 7" class="flow"/>
    <rect x="124" y="2" width="39" height="29" rx="9" fill="#fff4ee" class="soft-line"/><rect x="124" y="42" width="39" height="29" rx="9" fill="#f3faef" class="soft-line"/><rect x="124" y="82" width="39" height="29" rx="9" fill="#f4f1ff" class="soft-line"/>
    <text class="hand" x="135" y="22" font-size="13" font-weight="900" fill="#111827">A</text><text class="hand" x="135" y="62" font-size="13" font-weight="900" fill="#111827">B</text><text class="hand" x="135" y="102" font-size="13" font-weight="900" fill="#111827">C</text>
    <path d="M26 126h114" stroke="#398fca" stroke-width="5" stroke-linecap="round"/><circle cx="55" cy="126" r="7" fill="#f3c969" class="pulse"/><circle cx="104" cy="126" r="7" fill="#398fca" class="pulse" style="animation-delay:.45s"/>

  </g>
</svg>
